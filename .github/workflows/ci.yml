name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck proxmox scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          mapfile -t files < <(git ls-files 'proxmox/*' | grep -v '\.service$')
          shellcheck -x -S warning "${files[@]}"

  lib-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash proxmox/tests/lib-tests.sh

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: install, update and systemd tests in debian:13 containers
        run: bash proxmox/tests/run-container-tests.sh
