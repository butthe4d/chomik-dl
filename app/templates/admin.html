<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chomik-dl · admin</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1d2330; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --ok:#16a34a; --err:#dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b22; --fg:#e6e8ee; --muted:#9aa1ad; --line:#2a2f3a; --accent:#5b8cff; --ok:#3ecf74; --err:#ff6b6b; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  form { display:flex; gap:8px; }
  input[name=url] { flex:1; min-width:0; padding:10px 12px; font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:8px; }
  button { padding:10px 18px; font:inherit; font-weight:600; color:#fff; background:var(--accent); border:0; border-radius:8px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  #msg { min-height:1.4em; margin:8px 0 20px; color:var(--err); font-size:14px; }
  ul { list-style:none; padding:0; margin:0; display:grid; gap:8px; }
  li { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .top { display:flex; justify-content:space-between; gap:12px; }
  .name { font-weight:600; overflow-wrap:anywhere; }
  .status { font-size:13px; color:var(--muted); white-space:nowrap; }
  .done .status { color:var(--ok); } .failed .status { color:var(--err); }
  .sub { font-size:13px; color:var(--muted); overflow-wrap:anywhere; margin-top:2px; }
  .err { font-size:13px; color:var(--err); margin-top:4px; }
  progress { width:100%; height:6px; margin-top:6px; accent-color:var(--accent); }
  .who { font-size:13px; color:var(--muted); margin-top:2px; }
  .desc { font-size:13px; margin-top:4px; white-space:pre-line; overflow-wrap:anywhere; }
  .desc.clamped { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .more { background:none; color:var(--accent); padding:0; font-size:13px; font-weight:500; }
  .waiting .status { color:#d97706; } .rejected .status { color:var(--err); }
  .actions { display:flex; gap:8px; margin-top:8px; }
  .actions button { padding:6px 12px; font-size:13px; }
  .actions .reject { background:var(--err); }

  @media (max-width:520px) { form { flex-wrap:wrap; } input[name=name] { flex:1; } }
  .empty { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>chomik-dl · admin</h1>
  <form id="f">
    <input name="url" type="url" required placeholder="https://chomikuj.pl/…/plik,123.rar" autocomplete="off" autofocus>
    <button type="submit">Pobierz od razu</button>
  </form>
  <div id="msg" role="status"></div>
  <ul id="jobs"></ul>
</main>
<script>
const LABELS = {waiting: "czeka na akceptację", rejected: "odrzucone", queued: "w kolejce", resolving: "łączenie…", downloading: "pobieranie", done: "gotowe", failed: "błąd"};
const fmt = b => b == null ? "?" : b < 1048576 ? (b / 1024).toFixed(0) + " KB" : (b / 1048576).toFixed(1) + " MB";

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function render(jobs) {
  const ul = document.getElementById("jobs");
  ul.replaceChildren();
  if (!jobs.length) { ul.append(el("li", "empty", "Brak próśb.")); return; }
  const rank = j => j.status === "waiting" ? 0 : 1;
  jobs = jobs.slice().sort((x, y) => rank(x) - rank(y) || y.id - x.id);
  for (const j of jobs) {
    const li = el("li", j.status);
    const top = el("div", "top");
    top.append(el("span", "name", j.filename || j.name || decodeURIComponent(j.url.split("/").pop())));
    let status = LABELS[j.status] || j.status;
    if (j.status === "downloading") status += j.bytes_total ? ` ${Math.floor(100 * j.bytes_done / j.bytes_total)}%` : ` ${fmt(j.bytes_done)}`;
    if (j.status === "done") status += ` · ${fmt(j.bytes_done)}`;
    top.append(el("span", "status", status));
    li.append(top);
    const meta = [j.size_text, j.folder].filter(Boolean).join(" · ");
    if (meta) li.append(el("div", "sub", meta));
    if (j.requested_by) li.append(el("div", "who", "prosi: " + j.requested_by));
    if (j.description) li.append(describe(j.description));
    li.append(el("div", "sub", j.url));
    if (j.status === "downloading") {
      const p = el("progress");
      if (j.bytes_total) { p.max = j.bytes_total; p.value = j.bytes_done; }
      li.append(p);
    }
    if (j.status === "failed" && j.error_message) li.append(el("div", "err", j.error_message));
    if (j.status === "waiting") li.append(actions([["Akceptuj", "accept", ""], ["Odrzuć", "reject", "reject"]], j));
    if (j.status === "failed") li.append(actions([["Ponów", "retry", ""]], j));
    ul.append(li);
  }
}

function actions(defs, j) {
  const box = el("div", "actions");
  for (const [label, action, cls] of defs) {
    const b = el("button", cls, label);
    b.type = "button";
    b.addEventListener("click", async () => {
      b.disabled = true;
      try {
        const r = await fetch(`admin/requests/${j.id}/${action}`, {method: "POST"});
        if (!r.ok) document.getElementById("msg").textContent = (await r.json()).detail || "Błąd";
      } catch (e) { document.getElementById("msg").textContent = "Brak połączenia z serwerem"; }
      await refresh();
    });
    box.append(b);
  }
  return box;
}

function describe(text) {
  const wrap = el("div");
  const d = el("div", "desc clamped", text);
  wrap.append(d);
  if (text.split("\n").length > 3 || text.length > 200) {
    const b = el("button", "more", "więcej");
    b.type = "button";
    b.addEventListener("click", () => { const c = d.classList.toggle("clamped"); b.textContent = c ? "więcej" : "mniej"; });
    wrap.append(b);
  }
  return wrap;
}

async function refresh() {
  try { render(await (await fetch("requests")).json()); } catch (e) { /* server restarting */ }
}

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target, msg = document.getElementById("msg"), btn = form.querySelector("button");
  btn.disabled = true; msg.textContent = "";
  try {
    const r = await fetch("admin/requests", {method: "POST", body: new FormData(form)});
    if (!r.ok) { msg.textContent = (await r.json()).detail || "Błąd"; return; }
    form.elements.url.value = "";
    await refresh();
  } catch (err) {
    msg.textContent = "Brak połączenia z serwerem";
  } finally { btn.disabled = false; }
});

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
